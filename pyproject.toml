[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-radar-research"
version = "0.1.0"
description = "Physics-based asteroid radar echo simulation and rotation-period estimation"
requires-python = ">=3.9"
dependencies = [
  "astropy",
  "astroquery",
  "matplotlib",
  "numpy",
  "scipy",
  "torch",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
